name: test

# Frontera dura fuera de la máquina del desarrollador: la suite completa. La
# deriva de los derivados compilados se comprueba dentro de la suite, que falla
# si algún derivado no coincide con su fuente. La versión de Node es la mínima
# que declara `engines` en package.json.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11'
      - name: Suite de tests
        run: npm test
